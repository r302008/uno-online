<script type="text/babel-source" id="app-source" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const db = window.db;

// ---------------------------------------------------------------------------
// Constants & pure game logic
// ---------------------------------------------------------------------------

const COLORS = ["red", "yellow", "green", "blue"];
const COLOR_HEX = {
  red: "#E03131",
  yellow: "#F5B700",
  green: "#2F9E44",
  blue: "#1971C2",
  wild: "#1B1B1F",
};
const VALUE_LABEL = { skip: "⊘", reverse: "⇄", wild: "★", wild4: "+4", draw2: "+2" };

function makeDeck() {
  const deck = [];
  let idc = 0;
  COLORS.forEach((color) => {
    deck.push({ id: `c${idc++}`, color, value: "0" });
    for (let n = 1; n <= 9; n++) {
      deck.push({ id: `c${idc++}`, color, value: String(n) });
      deck.push({ id: `c${idc++}`, color, value: String(n) });
    }
    for (let i = 0; i < 2; i++) {
      deck.push({ id: `c${idc++}`, color, value: "skip" });
      deck.push({ id: `c${idc++}`, color, value: "reverse" });
      deck.push({ id: `c${idc++}`, color, value: "draw2" });
    }
  });
  for (let i = 0; i < 4; i++) {
    deck.push({ id: `c${idc++}`, color: "wild", value: "wild" });
    deck.push({ id: `c${idc++}`, color: "wild", value: "wild4" });
  }
  return deck;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nameOf(state, playerId) {
  const p = state.players.find((p) => p.id === playerId);
  return p ? p.name : "Someone";
}

function describeCard(card, forcedColor) {
  const c = forcedColor || card.color;
  const v = VALUE_LABEL[card.value] ?? card.value;
  return `${c} ${v}`;
}

function ensureDeck(state) {
  if (state.deck.length === 0 && state.discard.length > 1) {
    const top = state.discard[state.discard.length - 1];
    const rest = state.discard.slice(0, -1);
    state.deck = shuffle(rest);
    state.discard = [top];
  }
}

function drawCards(state, n) {
  const drawn = [];
  for (let i = 0; i < n; i++) {
    ensureDeck(state);
    if (state.deck.length === 0) break;
    drawn.push(state.deck.pop());
  }
  return drawn;
}

function getIndexAfter(state, steps) {
  const n = state.players.length;
  let idx = (state.currentPlayerIndex + steps * state.direction) % n;
  if (idx < 0) idx += n;
  return idx;
}

function advance(state, steps) {
  state.currentPlayerIndex = getIndexAfter(state, steps);
}

function isPlayable(card, state) {
  const top = state.discard[state.discard.length - 1];
  if (!top) return true;
  return card.color === "wild" || card.color === state.currentColor || card.value === top.value;
}

function applyPlayCard(state, playerId, cardIndex, chosenColor) {
  if (state.winner) return state;
  if (state.players[state.currentPlayerIndex].id !== playerId) return state;
  const hand = state.hands[playerId] || [];
  const card = hand[cardIndex];
  if (!card) return state;
  if (!isPlayable(card, state)) return state;

  hand.splice(cardIndex, 1);
  state.hands[playerId] = hand;
  state.discard.push(card);
  const newColor = card.color === "wild" ? chosenColor : card.color;
  state.currentColor = newColor;
  state.log.unshift(`${nameOf(state, playerId)} played ${describeCard(card, card.color === "wild" ? chosenColor : null)}`);

  if (hand.length === 0) {
    state.winner = playerId;
    state.log.unshift(`🎉 ${nameOf(state, playerId)} wins!`);
    state.log = state.log.slice(0, 6);
    return state;
  }
  if (hand.length === 1) {
    state.log.unshift(`${nameOf(state, playerId)} calls UNO!`);
  }

  if (card.value === "skip") {
    advance(state, 2);
  } else if (card.value === "reverse") {
    if (state.players.length === 2) {
      advance(state, 2);
    } else {
      state.direction *= -1;
      advance(state, 1);
    }
  } else if (card.value === "draw2") {
    const nextIdx = getIndexAfter(state, 1);
    const nextPlayer = state.players[nextIdx];
    const drawn = drawCards(state, 2);
    state.hands[nextPlayer.id] = [...(state.hands[nextPlayer.id] || []), ...drawn];
    state.log.unshift(`${nextPlayer.name} draws 2`);
    advance(state, 2);
  } else if (card.value === "wild4") {
    const nextIdx = getIndexAfter(state, 1);
    const nextPlayer = state.players[nextIdx];
    const drawn = drawCards(state, 4);
    state.hands[nextPlayer.id] = [...(state.hands[nextPlayer.id] || []), ...drawn];
    state.log.unshift(`${nextPlayer.name} draws 4`);
    advance(state, 2);
  } else {
    advance(state, 1);
  }
  state.log = state.log.slice(0, 6);
  return state;
}

function applyDrawCard(state, playerId) {
  if (state.winner) return state;
  if (state.players[state.currentPlayerIndex].id !== playerId) return state;
  const drawn = drawCards(state, 1);
  state.hands[playerId] = [...(state.hands[playerId] || []), ...drawn];
  state.log.unshift(`${nameOf(state, playerId)} drew a card`);
  state.log = state.log.slice(0, 6);
  advance(state, 1);
  return state;
}

function startGameState(players, hostId) {
  let deck = shuffle(makeDeck());
  const hands = {};
  players.forEach((p) => {
    hands[p.id] = deck.splice(0, 7);
  });
  let firstCard = deck.pop();
  while (firstCard.color === "wild") {
    deck.unshift(firstCard);
    deck = shuffle(deck);
    firstCard = deck.pop();
  }
  return {
    players,
    hostId,
    started: true,
    deck,
    discard: [firstCard],
    hands,
    currentPlayerIndex: 0,
    direction: 1,
    currentColor: firstCard.color,
    winner: null,
    log: [`Game started! ${players[0].name} goes first.`],
  };
}

function normalizeRoom(r) {
  if (!r) return r;
  return {
    ...r,
    deck: r.deck || [],
    discard: r.discard || [],
    log: r.log || [],
    players: r.players || [],
    hands: r.hands || {},
  };
}

function randomCode() {
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  let s = "";
  for (let i = 0; i < 4; i++) s += letters[Math.floor(Math.random() * letters.length)];
  return s;
}

function CardFace({ card, faceDown, size = "normal", onClick, disabled, playable }) {
  const dims =
    size === "small" ? { w: 48, h: 70, fs: 18, corner: 9 } : size === "tiny" ? { w: 34, h: 50, fs: 12, corner: 0 } : { w: 78, h: 112, fs: 26, corner: 11 };
  if (faceDown) {
    return (
      <div
        className="rounded-xl border-2 border-white/25 flex items-center justify-center shadow-md shrink-0"
        style={{ width: dims.w, height: dims.h, background: "linear-gradient(135deg, #1B1B1F, #2a2a35)" }}
      >
        <span className="font-display italic text-white/60" style={{ fontSize: dims.fs * 0.55, transform: "rotate(-14deg)" }}>
          UNO
        </span>
      </div>
    );
  }
  const solid = COLOR_HEX[card.color];
  const bg =
    card.color === "wild"
      ? "conic-gradient(from 0deg, #E03131 0deg 90deg, #F5B700 90deg 180deg, #2F9E44 180deg 270deg, #1971C2 270deg 360deg)"
      : `radial-gradient(circle at 30% 25%, ${solid}, ${solid} 55%, #00000022)`;
  const label = VALUE_LABEL[card.value] ?? card.value;
  const textColor = card.color === "wild" ? "#1B1B1F" : "#ffffff";
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className={`relative rounded-2xl border-solid border-white overflow-hidden shrink-0 transition-all duration-150 ${
        disabled
          ? "opacity-35 grayscale"
          : playable
          ? "hover:-translate-y-4 active:translate-y-0 active:scale-95 cursor-pointer"
          : "cursor-pointer hover:-translate-y-2"
      }`}
      style={{
        width: dims.w,
        height: dims.h,
        background: bg,
        borderWidth: 3,
        boxShadow: playable && !disabled ? `0 4px 18px -2px ${solid}aa, 0 2px 6px rgba(0,0,0,0.5)` : "0 2px 6px rgba(0,0,0,0.5)",
      }}
    >
      {dims.corner > 0 && (
        <>
          <span
            className="absolute top-1 left-1.5 font-display font-bold z-10"
            style={{ fontSize: dims.corner, color: textColor, textShadow: "0 1px 2px rgba(0,0,0,0.4)" }}
          >
            {label}
          </span>
          <span
            className="absolute bottom-1 right-1.5 font-display font-bold z-10"
            style={{ fontSize: dims.corner, color: textColor, textShadow: "0 1px 2px rgba(0,0,0,0.4)", transform: "rotate(180deg)" }}
          >
            {label}
          </span>
        </>
      )}
      <div className="absolute bg-white/90" style={{ width: "150%", height: "68%", borderRadius: "50%", transform: "rotate(-20deg)" }} />
      <span className="relative z-10 font-display font-bold" style={{ color: card.color === "wild" ? "#1B1B1F" : solid, fontSize: dims.fs }}>
        {label}
      </span>
    </button>
  );
}

function ChatPanel({ messages, myId, onSend, onClose }) {
  const [text, setText] = useState("");
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ block: "end" });
  }, [messages.length]);

  function submit(e) {
    e.preventDefault();
    const t = text.trim();
    if (!t) return;
    onSend(t);
    setText("");
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/50" onClick={onClose}>
      <div
        className="w-full max-w-md rounded-t-2xl border-t border-x border-white/10 flex flex-col"
        style={{ background: "#1c1c22", height: "70vh" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-4 py-3 border-b border-white/10">
          <span className="font-display font-semibold">Chat</span>
          <button onClick={onClose} className="text-white/40 text-sm">Close</button>
        </div>
        <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
          {messages.length === 0 && (
            <p className="text-white/30 text-sm text-center mt-6">No messages yet — say hi 👋</p>
          )}
          {messages.map((m) => (
            <div key={m.id} className={`flex flex-col ${m.playerId === myId ? "items-end" : "items-start"}`}>
              <span className="text-[11px] text-white/35 px-1">{m.playerId === myId ? "You" : m.name}</span>
              <span
                className="rounded-2xl px-3 py-1.5 text-sm max-w-[80%] break-words"
                style={{ background: m.playerId === myId ? COLOR_HEX.blue : "#33333c" }}
              >
                {m.text}
              </span>
            </div>
          ))}
          <div ref={bottomRef} />
        </div>
        <form onSubmit={submit} className="flex items-center gap-2 px-3 py-3 border-t border-white/10">
          <input
            value={text}
            onChange={(e) => setText(e.target.value)}

            className="flex-1 rounded-full border border-white/10 px-4 py-2 outline-none text-white placeholder-white/40 text-sm"

            style={{ background: COLOR_HEX.green }}
          >

          </button>
        </form>
      </div>
    </div>
  );
}



function UnoOnline() {
  const [playerId] = useState(() => "p-" + Math.random().toString(36).slice(2, 10));
  const [name, setName] = useState("");
  const [screen, setScreen] = useState("lobby");
  const [roomCode, setRoomCode] = useState("");
  const [joinInput, setJoinInput] = useState("");
  const [room, setRoom] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [pendingWild, setPendingWild] = useState(null);
  const [copied, setCopied] = useState(false);
  const [chatMessages, setChatMessages] = useState([]);
  const [showChat, setShowChat] = useState(false);
  const [unread, setUnread] = useState(0);
  const [floating, setFloating] = useState([]);
  const [showEmoji, setShowEmoji] = useState(false);
  const mountTimeRef = useRef(Date.now());

  async function fetchRoomOnce(code) {
    const snap = await db.ref("rooms/" + code).get();
    return snap.exists() ? normalizeRoom(snap.val()) : null;
  }

  async function saveRoom(code, state) {
    await db.ref("rooms/" + code).set(state);
  }

  // Live sync
  useEffect(() => {
    if (screen === "lobby" || !roomCode) return;
    const ref = db.ref("rooms/" + roomCode);
    const listener = ref.on("value", (snap) => {
      if (!snap.exists()) return;
      const val = normalizeRoom(snap.val());
      setRoom(val);
      setScreen(val.started ? "game" : "waiting");
    });
    return () => ref.off("value", listener);
  }, [screen === "lobby", roomCode]);

  // Chat sync (separate path so chat never collides with game-state writes)
  const showChatRef = useRef(showChat);
  useEffect(() => { showChatRef.current = showChat; if (showChat) setUnread(0); }, [showChat]);

  useEffect(() => {
    if (screen === "lobby" || !roomCode) {
      setChatMessages([]);
      return;
    }
    const chatRef = db.ref("chats/" + roomCode).limitToLast(100);
    const listener = chatRef.on("child_added", (snap) => {
      const msg = { id: snap.key, ...snap.val() };
      setChatMessages((prev) => (prev.find((m) => m.id === msg.id) ? prev : [...prev, msg]));
      setUnread((u) => (showChatRef.current ? 0 : u + 1));
    });
    return () => chatRef.off("child_added", listener);
  }, [screen === "lobby", roomCode]);

  async function sendChat(text) {
    if (!roomCode) return;
    await db.ref("chats/" + roomCode).push({
      playerId,
      name: name.trim() || "Player",
      text,
      ts: Date.now(),
    });
  }

  // Emoji reactions — separate path, transient floating animation, no game-state collision
  useEffect(() => {
    if (screen === "lobby" || !roomCode) return;
    const rRef = db.ref("reactions/" + roomCode).limitToLast(5);
    const listener = rRef.on("child_added", (snap) => {
      const val = snap.val();
      if (!val || val.ts < mountTimeRef.current) return;
      const id = snap.key + "-" + Math.random().toString(36).slice(2, 7);
      setFloating((prev) => [...prev, { id, emoji: val.emoji, name: val.name, x: 15 + Math.random() * 65 }]);
      setTimeout(() => setFloating((prev) => prev.filter((f) => f.id !== id)), 2300);
    });
    return () => rRef.off("child_added", listener);
  }, [screen === "lobby", roomCode]);

  async function sendReaction(emoji) {
    if (!roomCode) return;
    setShowEmoji(false);
    await db.ref("reactions/" + roomCode).push({
      playerId,
      name: name.trim() || "Player",
      emoji,
      ts: Date.now(),
    });
  }

  async function handleCreate() {
    if (!name.trim()) { setError("Enter your name first."); return; }
    setBusy(true); setError("");
    try {
      const code = randomCode();
      const state = {
        code, hostId: playerId,
        players: [{ id: playerId, name: name.trim() }],
        started: false, log: [],
      };
      await saveRoom(code, state);
      setRoom(state); setRoomCode(code); setScreen("waiting");
    } catch (e) {
      setError("Couldn't create the room: " + (e?.message || String(e)));
    } finally { setBusy(false); }
  }

  async function handleJoin() {
    if (!name.trim()) { setError("Enter your name first."); return; }
    const code = joinInput.trim().toUpperCase();
    if (!code) { setError("Enter a room code."); return; }
    setBusy(true); setError("");
    try {
      const r = await fetchRoomOnce(code);
      if (!r) { setError("Room not found. Double-check the code with your host."); return; }
      if (r.started) { setError("That game already started."); return; }
      if (!r.players.find((p) => p.id === playerId)) {
        r.players.push({ id: playerId, name: name.trim() });
        await saveRoom(code, r);
      }
      setRoom(r); setRoomCode(code); setScreen("waiting");
    } catch (e) {
      setError("Couldn't join: " + (e?.message || String(e)));
    } finally { setBusy(false); }
  }

  async function handleStart() {
    const r = await fetchRoomOnce(roomCode);
    if (!r || r.players.length < 2) return;
    const newState = { ...r, ...startGameState(r.players, r.hostId), code: roomCode, hostId: r.hostId };
    await saveRoom(roomCode, newState);
    setRoom(newState); setScreen("game");
  }

  async function handlePlay(cardIndex, chosenColor) {
    setBusy(true);
    try {
      const r = (await fetchRoomOnce(roomCode)) || room;
      const updated = applyPlayCard(structuredClone(r), playerId, cardIndex, chosenColor);
      await saveRoom(roomCode, updated);
      setRoom(updated);
    } finally { setBusy(false); }
  }

  async function handleDraw() {
    setBusy(true);
    try {
      const r = (await fetchRoomOnce(roomCode)) || room;
      const updated = applyDrawCard(structuredClone(r), playerId);
      await saveRoom(roomCode, updated);
      setRoom(updated);
    } finally { setBusy(false); }
  }

  function onCardTap(index, card) {
    if (busy || !room || room.winner) return;
    const me = room.players[room.currentPlayerIndex];
    if (me.id !== playerId) return;
    if (!isPlayable(card, room)) return;
    if (card.color === "wild") setPendingWild(index);
    else handlePlay(index, null);
  }

  function leaveRoom() {
    setScreen("lobby"); setRoom(null); setRoomCode("");
  }

  function copyCode() {
    navigator.clipboard?.writeText(roomCode);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }

  if (screen === "lobby") {
    return (
      <div className="min-h-screen w-full font-body text-white flex flex-col items-center justify-center p-6" style={{ background: "#15151a" }}>
        <div className="mb-2 flex gap-1 font-display font-bold text-6xl">
          <span style={{ color: COLOR_HEX.red }}>U</span>
          <span style={{ color: COLOR_HEX.yellow }}>N</span>
          <span style={{ color: COLOR_HEX.green }}>O</span>
          <span style={{ color: COLOR_HEX.blue }}>!</span>
        </div>
        <p className="text-white/50 mb-8 text-sm">Play with friends, any device.</p>

        <div className="w-full max-w-xs space-y-4">
          <input
            value={name} onChange={(e) => setName(e.target.value)} placeholder="Your name" maxLength={16}
            className="w-full rounded-xl border border-white/10 px-4 py-3 outline-none focus:border-white/40 text-center text-white placeholder-white/40"
            style={{ background: "#232329" }}
          />
          <button onClick={handleCreate} disabled={busy}
            className="w-full rounded-xl py-3 font-display font-semibold text-white shadow-md active:scale-95 transition-transform"
            style={{ background: COLOR_HEX.green }}>
            Create Room
          </button>

          <div className="flex items-center gap-2 text-white/30 text-xs">
            <div className="h-px bg-white/10 flex-1" /> or join <div className="h-px bg-white/10 flex-1" />
          </div>

          <div className="flex gap-2">
            <input
              value={joinInput} onChange={(e) => setJoinInput(e.target.value.toUpperCase())} placeholder="ROOM CODE" maxLength={4}
              className="flex-1 rounded-xl border border-white/10 px-4 py-3 outline-none focus:border-white/40 text-center tracking-widest font-display text-white placeholder-white/40"
              style={{ background: "#232329" }}
            />
            <button onClick={handleJoin} disabled={busy}
              className="rounded-xl px-5 font-display font-semibold text-white shadow-md active:scale-95"
              style={{ background: COLOR_HEX.blue }}>
              Join
            </button>
          </div>
          {error && <p className="text-red-400 text-sm text-center">{error}</p>}
        </div>
      </div>
    );
  }

  if (screen === "waiting" && room) {
    const isHost = room.hostId === playerId;
    return (
      <div className="min-h-screen w-full font-body text-white flex flex-col items-center justify-center p-6" style={{ background: "#15151a" }}>
        <p className="text-white/50 text-sm mb-2">Room code</p>
        <div className="flex items-center gap-3 mb-8">
          <div className="font-display font-bold text-5xl tracking-widest">{roomCode}</div>
          <button onClick={copyCode} className="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm">{copied ? "Copied" : "Copy"}</button>
        </div>

        <div className="w-full max-w-xs rounded-2xl border border-white/10 p-4 mb-6" style={{ background: "#232329" }}>
          <p className="text-white/40 text-xs uppercase mb-3 tracking-wide">Players ({room.players.length})</p>
          <div className="flex flex-wrap gap-2">
            {room.players.map((p) => (
              <span key={p.id} className="px-3 py-1.5 rounded-full text-sm font-medium"
                style={{ background: p.id === room.hostId ? COLOR_HEX.yellow : "#33333c", color: p.id === room.hostId ? "#1B1B1F" : "white" }}>
                {p.name}{p.id === playerId ? " (you)" : ""}
              </span>
            ))}
          </div>
        </div>

        {isHost ? (
          <button onClick={handleStart} disabled={room.players.length < 2}
            className="w-full max-w-xs rounded-xl py-3 font-display font-semibold shadow-md disabled:opacity-40"
            style={{ background: COLOR_HEX.green }}>
            {room.players.length < 2 ? "Need 2+ players" : "Start Game"}
          </button>
        ) : (
          <p className="text-white/50 text-sm">Waiting for host to start…</p>
        )}
        <button onClick={leaveRoom} className="mt-6 text-white/40 text-sm">Leave</button>
        <div className="flex gap-2 mt-3">
          <button onClick={() => setShowEmoji(true)} className="text-white/70 text-sm px-4 py-2 rounded-full bg-white/5">😊 React</button>
          <button onClick={() => setShowChat(true)} className="relative text-white/70 text-sm px-4 py-2 rounded-full bg-white/5">
            💬 Chat
            {unread > 0 && (
              <span className="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center">
                {unread}
              </span>
            )}
          </button>
        </div>
        {showChat && (
          <ChatPanel messages={chatMessages} myId={playerId} onSend={sendChat} onClose={() => setShowChat(false)} />
        )}
        {showEmoji && <EmojiPicker onPick={sendReaction} onClose={() => setShowEmoji(false)} />}
        <FloatingReactions items={floating} />
      </div>
    );
  }

  if (screen === "game" && room) {
    const me = room.players.find((p) => p.id === playerId);
    const myHand = room.hands[playerId] || [];
    const others = room.players.filter((p) => p.id !== playerId);
    const currentPlayer = room.players[room.currentPlayerIndex];
    const isMyTurn = currentPlayer.id === playerId && !room.winner;
    const top = room.discard[room.discard.length - 1];

    return (
      <div className="min-h-screen w-full font-body text-white flex flex-col" style={{ background: "#15151a" }}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-white/10">
          <div className="flex items-center gap-2">
            <span className="font-display font-bold text-lg">UNO</span>
            <span className="text-white/30 text-xs tracking-widest">{roomCode}</span>
          </div>
          <div className="flex items-center gap-2">
            <div className="w-4 h-4 rounded-full border border-white/40" style={{ background: COLOR_HEX[room.currentColor] }} title="current color" />
            <button onClick={() => setShowEmoji(true)} className="text-white/70 text-sm px-2 py-1 rounded-lg bg-white/5">
              😊
            </button>
            <button onClick={() => setShowChat(true)} className="relative text-white/70 text-sm px-2 py-1 rounded-lg bg-white/5">
              💬
              {unread > 0 && (
                <span className="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center">
                  {unread}
                </span>
              )}
            </button>
            <button onClick={leaveRoom} className="text-white/40 text-sm">Leave</button>
          </div>
        </div>

        <div className="flex flex-wrap gap-3 px-4 py-3 justify-center">
          {others.map((p) => (
            <div key={p.id} className={`flex flex-col items-center px-3 py-2 rounded-xl border transition-colors ${currentPlayer.id === p.id ? "border-amber-400 bg-amber-400/10" : "border-white/10 bg-white/5"}`}>
              <span className="text-sm font-medium">{p.name}</span>
              <div className="flex items-center gap-1 mt-1">
                <CardFace faceDown size="tiny" />
                <span className="text-xs text-white/60">{(room.hands[p.id] || []).length}</span>
              </div>
            </div>
          ))}
        </div>

        <div className="flex-1 flex flex-col items-center justify-center gap-4">
          <div className="flex items-center gap-8">
            <div className="relative">
              <div className="absolute" style={{ top: 3, left: 3, opacity: 0.5 }}><CardFace faceDown size="normal" /></div>
              <CardFace faceDown size="normal" />
              <span className="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] text-white/30">{room.deck.length} left</span>
            </div>
            <div className="relative">
              {top && (
                <div className="absolute" style={{ top: -3, left: 3, transform: "rotate(6deg)", opacity: 0.5 }}>
                  <CardFace card={top} size="normal" />
                </div>
              )}
              {top && <CardFace card={top} size="normal" />}
            </div>
          </div>
          <p className="text-white/50 text-sm h-5">
            {room.winner ? "" : isMyTurn ? "Your turn" : `Waiting for ${currentPlayer.name}…`}
          </p>
          {isMyTurn && !room.winner && (
            <button onClick={handleDraw} disabled={busy}
              className="rounded-xl px-5 py-2 font-display text-sm border border-white/20 bg-white/5 hover:bg-white/10">
              Draw a card
            </button>
          )}
        </div>

        <div className="px-4 text-xs text-white/30 text-center h-4 truncate">{room.log?.[0]}</div>

        <div className="px-3 pb-4 pt-6">
          <div className="flex items-center justify-between mb-2 px-1">
            <span className="text-sm font-medium">{me?.name} (you)</span>
            {myHand.length <= 2 && <span className="text-amber-400 text-xs font-semibold animate-pulse">✦ UNO!</span>}
          </div>
          <div className="flex overflow-x-auto overflow-y-visible pb-2 pt-4 px-4" style={{ justifyContent: myHand.length < 6 ? "center" : "flex-start" }}>
            {myHand.map((card, i) => {
              const n = myHand.length;
              const center = (n - 1) / 2;
              const offset = i - center;
              const rotate = Math.max(-16, Math.min(16, offset * (n > 10 ? 4 : 7)));
              const lift = Math.min(Math.abs(offset) * 2.5, 14);
              return (
                <div
                  key={card.id}
                  style={{ marginLeft: i === 0 ? 0 : -26, transform: `rotate(${rotate}deg) translateY(${lift}px)`, transformOrigin: "bottom center", transition: "transform 150ms" }}
                >
                  <CardFace
                    card={card}
                    disabled={!isMyTurn || !isPlayable(card, room)}
                    playable={isMyTurn && isPlayable(card, room)}
                    onClick={() => onCardTap(i, card)}
                  />
                </div>
              );
            })}
          </div>
        </div>

        {pendingWild !== null && (
          <ColorPicker
            onPick={(c) => { handlePlay(pendingWild, c); setPendingWild(null); }}
            onCancel={() => setPendingWild(null)}
          />
        )}

        {showChat && (
          <ChatPanel messages={chatMessages} myId={playerId} onSend={sendChat} onClose={() => setShowChat(false)} />
        )}

        {showEmoji && <EmojiPicker onPick={sendReaction} onClose={() => setShowEmoji(false)} />}

        <FloatingReactions items={floating} />

        {room.winner && (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-6">
            <div className="rounded-2xl p-8 border border-white/10 text-center max-w-xs" style={{ background: "#232329" }}>
              <p className="font-display text-3xl mb-2">{room.winner === playerId ? "You win! 🎉" : `${nameOf(room, room.winner)} wins!`}</p>
              <button onClick={leaveRoom} className="mt-4 rounded-xl px-5 py-2 font-display" style={{ background: COLOR_HEX.green }}>
                Back to lobby
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }

  return <div className="min-h-screen w-full text-white flex items-center justify-center" style={{ background: "#15151a" }}>Loading…</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<UnoOnline />);
</script>

<script>
  try {
    var sourceEl = document.getElementById("app-source");
    var code = sourceEl.textContent;
    var output = Babel.transform(code, { presets: ["react"] }).code;
    (0, eval)(output);
  } catch (err) {
    var el = document.getElementById("root");
    el.innerHTML =
      '<pre style="color:#ff6b6b;background:#1a1a1a;padding:20px;white-space:pre-wrap;font-size:13px;font-family:monospace;">' +
      "Build error: " + (err && err.message ? err.message : String(err)) +
      "</pre>";
  }
</script>
</body>
</html>
